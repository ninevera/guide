<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NINEVERA PRESS GUIDE</title>
<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #f4f4f0;
}
.slider {
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
}
.slide {
  min-width: 100%;
  scroll-snap-align: start;
}
img {
  width: 100%;
  height: auto;
  display: block;
}
</style>
</head>
<body>

<div class="slider">
  <div class="slide">
    <img src="face.jpg" alt="Face Guide">
  </div>
  <div class="slide">
    <img src="ear.jpg" alt="Ear Guide">
  </div>
</div>

</body>
</html>
